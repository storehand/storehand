query ProductsByCollection($handle: String!, $first: Int!) {
  collectionByHandle(handle: $handle) {
    id
    handle
    products(first: $first) {
      pageInfo { hasNextPage }
      nodes {
        id
        handle
        title
        description
        descriptionHtml
        seo { title description }
        media(first: 10) {
          pageInfo { hasNextPage }
          nodes { ... on MediaImage { id alt image { url } } }
        }
      }
    }
  }
}
