# All collections: their handle for the storefront URL check and their
# description for the metadata check. Read-only.
# Collection.onlineStoreUrl does not exist on 2026-07 (verified live) —
# a collection URL that 404s IS the finding, whatever the publication state.
query CollectionsHealth($first: Int!) {
  collections(first: $first) {
    nodes {
      id
      title
      handle
      description
    }
    pageInfo {
      hasNextPage
    }
  }
}
