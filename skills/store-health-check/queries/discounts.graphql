# Discount codes and automatic discounts with their window. Read-only.
# Needs the read_discounts scope. Three findings are derived from this:
# ACTIVE without endsAt, expired in the past week, ACTIVE ending within 7 days.
# Statuses are re-checked against the clock — never trust status alone.
query Discounts($first: Int!) {
  discountNodes(first: $first) {
    nodes {
      id
      discount {
        __typename
        ... on DiscountCodeBasic { title status startsAt endsAt }
        ... on DiscountCodeBxgy { title status startsAt endsAt }
        ... on DiscountCodeFreeShipping { title status startsAt endsAt }
        ... on DiscountAutomaticBasic { title status startsAt endsAt }
        ... on DiscountAutomaticBxgy { title status startsAt endsAt }
        ... on DiscountAutomaticFreeShipping { title status startsAt endsAt }
      }
    }
    pageInfo {
      hasNextPage
    }
  }
}
