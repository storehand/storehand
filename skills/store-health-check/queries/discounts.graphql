# Discount codes and automatic discounts with their window. Read-only.
# Needs the read_discounts scope. Four findings are derived from this: pending
# (ACTIVE or SCHEDULED) without endsAt, expired in the past week, pending and
# ending within 7 days, and status contradicting its own dates.
# Statuses are re-checked against the clock — never trust status alone, which
# is why startsAt comes along even though no rule reads it in isolation.
# Sorted by last update, newest first: on a store with more discounts than
# $first, the stale tail drops off, not the recent ones.
query Discounts($first: Int!) {
  discountNodes(first: $first, sortKey: UPDATED_AT, reverse: true) {
    nodes {
      id
      discount {
        __typename
        ... on DiscountCodeBasic { title status startsAt endsAt }
        ... on DiscountCodeBxgy { title status startsAt endsAt }
        ... on DiscountCodeFreeShipping { title status startsAt endsAt }
        ... on DiscountAutomaticBasic { title status startsAt endsAt }
        ... on DiscountAutomaticBxgy { title status startsAt endsAt }
        ... on DiscountAutomaticFreeShipping { title status startsAt endsAt }
        ... on DiscountAutomaticApp { title status startsAt endsAt }
        ... on DiscountCodeApp { title status startsAt endsAt }
      }
    }
    pageInfo {
      hasNextPage
    }
  }
}
