name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # First: nothing else matters if the change leaks something. Findings are
      # masked because this log is public on a public repository.
      - name: Scan for sensitive data
        run: node scripts/scan-secrets.mjs .
      - name: Run tests
        run: node --test
      - name: Validate plugin structure
        run: node scripts/validate-plugin.mjs .
